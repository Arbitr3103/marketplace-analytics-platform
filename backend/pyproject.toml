[project]
name = "marketplace-analytics-backend"
version = "0.1.0"
description = "Sanitized FastAPI backend for a marketplace analytics portfolio project"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136,<0.137",
    "uvicorn[standard]>=0.41,<0.42",
    "pydantic-settings>=2.12,<3",
    "sqlalchemy[asyncio]>=2.0.49,<3",
    "asyncpg>=0.31,<0.32",
    "redis>=7.1,<8",
]

[dependency-groups]
dev = [
    "httpx2>=2.9,<3",
    "mypy>=1.19,<2",
    "pytest>=9,<10",
    "pytest-asyncio>=1.3,<2",
    "ruff>=0.14,<0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marketplace_analytics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["redis.*"]
ignore_missing_imports = true
